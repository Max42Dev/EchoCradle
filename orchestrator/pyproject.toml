[project]
name = "echocradle-orchestrator"
version = "0.1.0"
description = "EchoCradle Model Orchestrator: one local API for text, speech and (later) image/3D/audio models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Text inference. The orchestrator drives llama.cpp's llama-server over HTTP.
text = ["httpx>=0.27"]
# Speech (TTS + streaming STT + VAD), CPU-only, Apache-2.0.
speech = ["sherpa-onnx>=1.13.8", "numpy>=1.26"]
# Everything needed to run the interview experiment.
all = ["httpx>=0.27", "sherpa-onnx>=1.13.8", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
